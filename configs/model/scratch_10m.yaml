# ~10M-parameter Gemma 3 architecture, randomly initialized, with the smoke Tamil tokenizer.
# Same code path as the real run (Gemma3ForCausalLM, sliding + global attention, GQA),
# just tiny — for verifying data → tokenizer → training → eval → SFT → quantization.
model:
  source: scratch
  init_seed: 0
  attn_implementation: sdpa
  pad_vocab_to_multiple_of: 64
  architecture:
    hidden_size: 256
    intermediate_size: 1024
    num_hidden_layers: 6
    num_attention_heads: 4
    num_key_value_heads: 1
    head_dim: 64
    query_pre_attn_scalar: 64
    max_position_embeddings: 2048
    sliding_window: 128
    layer_types: [sliding_attention, sliding_attention, sliding_attention,
                  sliding_attention, sliding_attention, full_attention]
    rope_theta: 1000000.0
    rope_local_base_freq: 10000.0
    hidden_activation: gelu_pytorch_tanh
    rms_norm_eps: 1.0e-6
    tie_word_embeddings: true

tokenizer:
  path: ${paths.tokenizers}/tamil_bpe_smoke_16k

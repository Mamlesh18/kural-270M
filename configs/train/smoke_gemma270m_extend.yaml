# A few optimizer steps on the REAL Gemma 3 270M with the smoke-extended tokenizer.
# Verifies checkpoint download, vocabulary extension + embedding init, bf16/fp32 training,
# checkpointing and resume on the actual architecture. Runs on CPU (slowly) or any GPU.
#   KURAL_BASE_MODEL=unsloth/gemma-3-270m python -m training.pretrain --config configs/train/smoke_gemma270m_extend.yaml
defaults:
  - ../base.yaml
  - ../model/gemma3_270m_extend.yaml
  - mixture_smoke.yaml

run_name: smoke-gemma270m-extend

tokenizer:
  path: ${paths.tokenizers}/gemma3_tamil_extended_smoke

wandb:
  mode: offline
  group: smoke
  tags: [smoke, 270m, extend]

data:
  packed_dir: ${paths.packed}/smoke_gemma3ext_seq128
  seq_len: 128
  eval_max_blocks: 16

train:
  output_dir: ${paths.checkpoints}/${run_name}
  resume: auto
  precision: auto
  trainable: all
  args:
    max_steps: 6
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 2
    learning_rate: 1.0e-4
    lr_scheduler_type: constant_with_warmup
    warmup_steps: 1
    weight_decay: 0.1
    adam_beta2: 0.95
    max_grad_norm: 1.0
    optim: adamw_torch_fused
    logging_steps: 1
    eval_strategy: steps
    eval_steps: 3
    save_strategy: steps
    save_steps: 3
    save_total_limit: 1
    dataloader_num_workers: 0
    remove_unused_columns: false

sample_generation:
  max_new_tokens: 16
  prompts:
    - "தமிழ்நாட்டின் தலைநகரம்"

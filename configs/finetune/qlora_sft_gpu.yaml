# QLoRA: LoRA on a 4-bit NF4 base. Needs a CUDA GPU + `pip install bitsandbytes`
# (refused on CPU). Uses bf16 compute.
defaults:
  - lora_sft_cpu.yaml

run_name: qlora-sft-tamil
finetune:
  method: qlora
  gradient_checkpointing: true
train:
  precision: auto
  args:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 2

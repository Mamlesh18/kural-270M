[project]
name = "kural-270m"
version = "0.1.0"
description = "Tamil-specific small language model: continued pretraining of Gemma 3 270M"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.53,<5",
  "datasets>=3.0",
  "accelerate>=1.0",
  "tokenizers>=0.21",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
  "safetensors>=0.4",
  "huggingface_hub>=0.30",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "xxhash>=3.4",
  "regex>=2024.0",
  "wandb>=0.17",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43", "torchao>=0.8"]
langid = ["fasttext-wheel>=0.9.2"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["common", "data", "tokenizer", "training", "evaluation", "inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
